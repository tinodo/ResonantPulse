name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Musical correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test deterministic engine
        run: dotnet test tests/ResonantPulse.Core.Tests/ResonantPulse.Core.Tests.csproj --configuration Release --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - name: Test actual app accent projections and localized recovery guidance
        run: dotnet test tests/ResonantPulse.App.Tests/ResonantPulse.App.Tests.csproj --configuration Release --logger "trx;LogFileName=app-projections.trx" --results-directory TestResults
      - name: Check whitespace
        run: git diff --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-locks-core
          path: |
            src/ResonantPulse.Core/packages.lock.json
            tests/ResonantPulse.Core.Tests/packages.lock.json
            tests/ResonantPulse.App.Tests/packages.lock.json
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Generate original application artwork
        run: ./packaging/Generate-Assets.ps1
      - name: Publish self-contained Windows application
        env:
          BUILD_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: |
          dotnet publish src/ResonantPulse.App/ResonantPulse.App.csproj --configuration Release --runtime win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -p:DistributionMode=Portable "-p:Version=$env:BUILD_VERSION" --self-contained true --output artifacts/portable-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
          @{version=$env:BUILD_VERSION;commit=$env:GITHUB_SHA;run="$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID";architecture='${{ matrix.arch }}'} | ConvertTo-Json | Set-Content "artifacts/portable-${{ matrix.arch }}/build-info.json" -Encoding utf8
      - name: Verify distribution layout
        run: ./packaging/Verify-Layout.ps1 -Payload "artifacts/portable-${{ matrix.arch }}"
      - name: Record published XAML resource layout
        run: |
          $payload = (Resolve-Path "artifacts/portable-${{ matrix.arch }}").Path
          Get-ChildItem -LiteralPath $payload -File -Recurse | Where-Object { $_.Extension -in '.pri','.xbf' } | ForEach-Object { "$($_.FullName.Substring($payload.Length + 1)) ($($_.Length) bytes)" }
      - name: Include legal and operating information
        run: Copy-Item LICENSE,THIRD-PARTY-NOTICES.md,README.md -Destination "artifacts/portable-${{ matrix.arch }}"
      - name: Verify native first-use controls and available-output playback
        if: matrix.arch == 'x64'
        run: ./packaging/Smoke-Launch.ps1 -Payload artifacts/portable-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64' && always()
        with:
          name: native-startup
          path: |
            artifacts/startup.png
            artifacts/play-800x600.png
            artifacts/play-1000x720.png
            artifacts/play-many-pulses.png
            artifacts/play-400x720.png
            artifacts/play-320x900.png
            artifacts/help-*.png
            artifacts/tempo-*.png
            artifacts/timing-*.png
            artifacts/stems-*.png
            artifacts/application-stdout.log
            artifacts/application-stderr.log
            artifacts/native-app.log
            artifacts/native-events.log
            artifacts/first-use.json
          if-no-files-found: warn
      - name: Build unsigned development MSIX
        run: |
          ./packaging/New-Package.ps1 -Payload "artifacts/portable-${{ matrix.arch }}" -Architecture '${{ matrix.arch }}' -Version '0.1.0.0' -Output "artifacts/ResonantPulse-development-${{ matrix.arch }}.msix" -Development
      - name: Install, activate and uninstall the packaged application
        if: matrix.arch == 'x64'
        run: ./packaging/Smoke-Package.ps1 -Package artifacts/ResonantPulse-development-x64.msix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64' && always()
        with:
          name: packaged-startup
          path: artifacts/packaged-startup/
          if-no-files-found: warn
      - name: Archive portable distribution and checksums
        run: |
          Compress-Archive -Path "artifacts/portable-${{ matrix.arch }}/*" -DestinationPath "artifacts/ResonantPulse-win-${{ matrix.arch }}.zip"
          Get-FileHash "artifacts/ResonantPulse-win-${{ matrix.arch }}.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content "artifacts/ResonantPulse-win-${{ matrix.arch }}.zip.sha256" -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            artifacts/ResonantPulse-win-${{ matrix.arch }}.zip
            artifacts/ResonantPulse-win-${{ matrix.arch }}.zip.sha256
            artifacts/ResonantPulse-development-${{ matrix.arch }}.msix
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64'
        with:
          name: dependency-locks-app
          path: src/ResonantPulse.App/packages.lock.json
          if-no-files-found: error

  windows-file-integrity:
    name: Windows file integrity
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Exercise Windows file-lock and export rollback semantics
        run: dotnet test tests/ResonantPulse.Core.Tests/ResonantPulse.Core.Tests.csproj -c Release --filter "FullyQualifiedName~WaveExporterTests|FullyQualifiedName~WaveStemExporterTests|FullyQualifiedName~TimingCsvExporterTests" --logger "trx;LogFileName=windows-integrity.trx" --results-directory TestResults-Windows
      - name: Exercise Windows workspace and concurrent preference persistence
        run: dotnet test tests/ResonantPulse.App.Tests/ResonantPulse.App.Tests.csproj -c Release --filter FullyQualifiedName~LocalWorkspaceTests --logger "trx;LogFileName=windows-workspace.trx" --results-directory TestResults-Windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-file-integrity-results
          path: TestResults-Windows/
          if-no-files-found: error
